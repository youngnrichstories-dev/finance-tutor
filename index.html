<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>금융 근육 — 나만의 금융 선생님</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand" data-go="home">💪 금융 근육</div>
    <div class="topbar-right">
      <button id="who" class="pill info" data-go="profiles" title="사용자 바꾸기" style="border:none;cursor:pointer"></button>
      <span id="streak" class="pill" title="연속 학습일"></span>
      <button class="icon-btn" data-go="settings" title="설정">⚙︎</button>
    </div>
  </header>

  <nav class="sidenav">
    <button data-go="home"><span class="ico">🏠</span><span>오늘</span></button>
    <button data-go="curriculum"><span class="ico">📚</span><span>커리큘럼</span></button>
    <button data-go="cards"><span class="ico">🃏</span><span>용어 카드</span></button>
    <button data-go="tutor"><span class="ico">🎓</span><span>튜터</span></button>
    <button data-go="stocks"><span class="ico">📊</span><span>종목분석</span></button>
    <button data-go="market"><span class="ico">🌍</span><span>오늘의 시장</span></button>
    <button data-go="notes"><span class="ico">📝</span><span>내 노트</span></button>
  </nav>

  <main id="view" class="view"></main>
</div>

<!-- 데이터 (순서 중요: 커리큘럼 → 연습 → 용어) -->
<script src="data-curriculum-1.js"></script>
<script src="data-curriculum-2.js"></script>
<script src="data-curriculum-3.js"></script>
<script src="data-practice-1.js"></script>
<script src="data-terms-1.js"></script>
<script src="data-terms-2.js"></script>
<!-- 앱 -->
<script src="js-store.js"></script>
<script src="js-md.js"></script>
<script src="js-srs.js"></script>
<script src="js-claude.js"></script>
<script src="js-prompts.js"></script>
<script src="js-app.js"></script>
<script src="js-views.js"></script>
<script src="js-profiles.js"></script>
<script src="js-notes.js"></script>
</body>
</html>
